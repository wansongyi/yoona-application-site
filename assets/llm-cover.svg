<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Quantized LLM adaptation research preview</title>
  <desc id="desc">A refined editorial research graphic showing low-rank adaptation and the trainable-parameter reduction studied in the paper.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8ecee"/><stop offset=".52" stop-color="#f4f1ea"/><stop offset="1" stop-color="#e8e1d9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#26343d" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg)"/>
  <g transform="translate(62 56)"><rect width="42" height="42" rx="13" fill="#405669"/><text x="21" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#fff">YL</text><text x="58" y="28" font-family="Inter,Arial" font-size="14" font-weight="750" letter-spacing="2" fill="#566873">RESEARCH NOTE · 2025</text></g>
